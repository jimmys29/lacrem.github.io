<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Vendedores - La Crem</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-family: inherit;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .button-group button {
            flex: 1;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-edit {
            background: #17a2b8;
            width: auto;
            padding: 8px 12px;
            font-size: 0.85em;
            margin-left: 5px;
        }

        .btn-delete {
            background: #dc3545;
            width: auto;
            padding: 8px 12px;
            font-size: 0.85em;
            margin-left: 5px;
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .usuarios-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .usuario-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .usuario-item.inactivo {
            opacity: 0.6;
            border-left-color: #dc3545;
        }

        .usuario-info h4 {
            color: #333;
            margin-bottom: 5px;
        }

        .usuario-info p {
            color: #666;
            font-size: 0.9em;
            margin: 3px 0;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: 600;
            margin-left: 5px;
        }

        .badge.admin {
            background: #ffc107;
            color: #000;
        }

        .badge.vendedor {
            background: #17a2b8;
            color: white;
        }

        .badge.inactivo {
            background: #dc3545;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-user-tie"></i> Gestión de Vendedores</h1>
            <p>Administra usuarios y vendedores del sistema</p>
            <a href="index.html" style="color: white; text-decoration: none; margin-top: 10px; display: inline-block;">
                <i class="fas fa-arrow-left"></i> Volver al panel
            </a>
        </div>

        <div class="content">
            <!-- Formulario para crear/editar usuario -->
            <div class="card">
                <h2 id="formTitle"><i class="fas fa-user-plus"></i> Crear Nuevo Usuario</h2>
                <div id="message" class="alert"></div>

                <form id="formUsuario">
                    <input type="hidden" id="usuario_id" name="usuario_id">
                    
                    <div class="form-group">
                        <label for="nombre">Nombre Completo *</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Correo Electrónico *</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="usuario">Usuario *</label>
                        <input type="text" id="usuario" name="usuario" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña <span id="passwordLabel">*</span></label>
                        <input type="password" id="password" name="password">
                        <small style="color: #666;">Mínimo 6 caracteres</small>
                    </div>

                    <div class="form-group">
                        <label for="rol">Rol *</label>
                        <select id="rol" name="rol" required>
                            <option value="vendedor">Vendedor</option>
                            <option value="admin">Administrador</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="activo">Estado *</label>
                        <select id="activo" name="activo" required>
                            <option value="true">Activo</option>
                            <option value="false">Inactivo</option>
                        </select>
                    </div>

                    <div class="button-group">
                        <button type="submit">
                            <i class="fas fa-save"></i> <span id="btnText">Guardar Usuario</span>
                        </button>
                        <button type="button" class="btn-secondary" id="btnCancelar" style="display: none;" onclick="cancelarEdicion()">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                    </div>
                </form>
            </div>

            <!-- Lista de usuarios -->
            <div class="card">
                <h2><i class="fas fa-list"></i> Usuarios Registrados</h2>
                <div class="usuarios-list" id="usuariosList">
                    <p style="text-align: center; color: #999;">Cargando usuarios...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let usuarioEditando = null;

        // Cargar usuarios al iniciar
        document.addEventListener('DOMContentLoaded', () => {
            verificarAutenticacion();
            cargarUsuarios();
        });

        async function verificarAutenticacion() {
            try {
                const response = await fetch('api/api.php?action=check_auth');
                const result = await response.json();
                if (!result.authenticated) {
                    window.location.href = 'login.html';
                    return;
                }
                
                // Verificar si es admin
                if (result.user.rol !== 'admin') {
                    alert('No tienes permisos para acceder a esta página');
                    window.location.href = 'index.html';
                }
            } catch (error) {
                console.error('Error verificando autenticación:', error);
                window.location.href = 'login.html';
            }
        }

        // Enviar formulario
        document.getElementById('formUsuario').addEventListener('submit', async (e) => {
            e.preventDefault();

            const usuario_id = document.getElementById('usuario_id').value;
            const password = document.getElementById('password').value;

            // Validar contraseña solo si se está creando o si se cambió
            if (!usuario_id && (!password || password.length < 6)) {
                mostrarMensaje('La contraseña debe tener al menos 6 caracteres', 'error');
                return;
            }

            const usuario = {
                nombre: document.getElementById('nombre').value,
                email: document.getElementById('email').value,
                usuario: document.getElementById('usuario').value,
                rol: document.getElementById('rol').value,
                activo: document.getElementById('activo').value === 'true'
            };

            // Solo incluir password si se proporcionó
            if (password) {
                usuario.password = password;
            }

            // Si estamos editando, agregar el ID
            if (usuario_id) {
                usuario.id = usuario_id;
            }

            try {
                const action = usuario_id ? 'actualizar_usuario' : 'crear_usuario';
                const response = await fetch(`api/api.php?action=${action}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(usuario)
                });

                const result = await response.json();

                if (result.success) {
                    mostrarMensaje(usuario_id ? 'Usuario actualizado correctamente' : 'Usuario creado correctamente', 'success');
                    cancelarEdicion();
                    cargarUsuarios();
                } else {
                    mostrarMensaje(result.message || 'Error al guardar el usuario', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('Error al guardar el usuario', 'error');
            }
        });

        async function cargarUsuarios() {
            try {
                const response = await fetch('api/api.php?action=obtener_usuarios');
                const usuarios = await response.json();

                const usuariosList = document.getElementById('usuariosList');

                if (usuarios.length === 0) {
                    usuariosList.innerHTML = '<p style="text-align: center; color: #999;">No hay usuarios registrados</p>';
                    return;
                }

                let html = '';
                usuarios.forEach(usuario => {
                    const inactivo = !usuario.activo ? 'inactivo' : '';
                    html += `
                        <div class="usuario-item ${inactivo}">
                            <div class="usuario-info">
                                <h4>
                                    ${usuario.nombre}
                                    <span class="badge ${usuario.rol}">${usuario.rol === 'admin' ? 'Admin' : 'Vendedor'}</span>
                                    ${!usuario.activo ? '<span class="badge inactivo">Inactivo</span>' : ''}
                                </h4>
                                <p><i class="fas fa-user"></i> Usuario: ${usuario.usuario}</p>
                                <p><i class="fas fa-envelope"></i> ${usuario.email}</p>
                                <p><i class="fas fa-calendar"></i> Creado: ${new Date(usuario.fecha_creacion).toLocaleDateString()}</p>
                            </div>
                            <div>
                                <button class="btn-edit" onclick='editarUsuario(${JSON.stringify(usuario).replace(/'/g, "\\'")})'>
                                    <i class="fas fa-edit"></i> Editar
                                </button>
                                ${usuario.id !== 'admin_001' ? `
                                <button class="btn-delete" onclick="eliminarUsuario('${usuario.id}', '${usuario.nombre.replace(/'/g, "\\'")}')">
                                    <i class="fas fa-trash"></i> Eliminar
                                </button>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });

                usuariosList.innerHTML = html;
            } catch (error) {
                console.error('Error al cargar usuarios:', error);
                document.getElementById('usuariosList').innerHTML = '<p style="color: red;">Error al cargar los usuarios</p>';
            }
        }

        function editarUsuario(usuario) {
            usuarioEditando = usuario;
            
            // Cambiar título del formulario
            document.getElementById('formTitle').innerHTML = '<i class="fas fa-edit"></i> Editar Usuario';
            document.getElementById('btnText').textContent = 'Actualizar Usuario';
            document.getElementById('btnCancelar').style.display = 'block';
            document.getElementById('passwordLabel').textContent = '(dejar en blanco para no cambiar)';
            
            // Rellenar formulario
            document.getElementById('usuario_id').value = usuario.id;
            document.getElementById('nombre').value = usuario.nombre;
            document.getElementById('email').value = usuario.email;
            document.getElementById('usuario').value = usuario.usuario;
            document.getElementById('password').value = '';
            document.getElementById('password').removeAttribute('required');
            document.getElementById('rol').value = usuario.rol;
            document.getElementById('activo').value = usuario.activo ? 'true' : 'false';
            
            // Scroll al formulario
            document.querySelector('.content').scrollIntoView({ behavior: 'smooth' });
        }

        function cancelarEdicion() {
            usuarioEditando = null;
            
            // Restaurar título del formulario
            document.getElementById('formTitle').innerHTML = '<i class="fas fa-user-plus"></i> Crear Nuevo Usuario';
            document.getElementById('btnText').textContent = 'Guardar Usuario';
            document.getElementById('btnCancelar').style.display = 'none';
            document.getElementById('passwordLabel').textContent = '*';
            
            // Limpiar formulario
            document.getElementById('formUsuario').reset();
            document.getElementById('usuario_id').value = '';
            document.getElementById('password').setAttribute('required', 'required');
        }

        async function eliminarUsuario(usuarioId, nombre) {
            if (!confirm(`¿Está seguro de que desea eliminar al usuario ${nombre}?`)) return;

            try {
                const response = await fetch('api/api.php?action=eliminar_usuario', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: `id=${usuarioId}`
                });

                const result = await response.json();

                if (result.success) {
                    mostrarMensaje('Usuario eliminado correctamente', 'success');
                    cargarUsuarios();
                } else {
                    mostrarMensaje(result.message || 'Error al eliminar el usuario', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('Error al eliminar el usuario', 'error');
            }
        }

        function mostrarMensaje(mensaje, tipo) {
            const element = document.getElementById('message');
            element.textContent = mensaje;
            element.className = `alert ${tipo}`;
            
            if (tipo === 'success') {
                setTimeout(() => {
                    element.style.display = 'none';
                }, 3000);
            }
        }
    </script>
</body>
</html>
