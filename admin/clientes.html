<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes - La Crem</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"],
        input[type="phone"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-family: inherit;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .button-group button {
            flex: 1;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-danger {
            background: #dc3545;
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .clientes-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .cliente-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cliente-info h4 {
            color: #333;
            margin-bottom: 5px;
        }

        .cliente-info p {
            color: #666;
            font-size: 0.9em;
            margin: 3px 0;
        }

        .btn-edit,
        .btn-delete {
            padding: 8px 12px;
            font-size: 0.85em;
            margin-left: 5px;
            width: auto;
            display: inline-block;
        }

        .btn-edit {
            background: #17a2b8;
        }

        .btn-delete {
            background: #dc3545;
        }

        .pagination {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .pagination button {
            width: auto;
            padding: 8px 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-users"></i> Gestión de Clientes</h1>
            <p>Administra los clientes y sus pedidos</p>
            <a href="index.html" style="color: white; text-decoration: none; margin-top: 10px; display: inline-block;">
                <i class="fas fa-arrow-left"></i> Volver al panel
            </a>
        </div>

        <div class="content">
            <!-- Formulario para crear cliente -->
            <div class="card">
                <h2><i class="fas fa-user-plus"></i> Crear Nuevo Cliente</h2>
                <div id="message" class="alert"></div>

                <form id="formCliente">
                    <div class="form-group">
                        <label for="nombre">Nombre Completo *</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Correo Electrónico *</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="telefono">Teléfono *</label>
                        <input type="text" id="telefono" name="telefono" required>
                    </div>

                    <div class="form-group">
                        <label for="direccion">Dirección</label>
                        <textarea id="direccion" name="direccion" placeholder="Calle, número, ciudad..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="empresa">Empresa/Negocio</label>
                        <input type="text" id="empresa" name="empresa" placeholder="Opcional">
                    </div>

                    <div class="form-group">
                        <label for="notas">Notas</label>
                        <textarea id="notas" name="notas" placeholder="Información adicional..."></textarea>
                    </div>

                    <button type="submit">
                        <i class="fas fa-save"></i> Guardar Cliente
                    </button>
                </form>
            </div>

            <!-- Lista de clientes -->
            <div class="card">
                <h2><i class="fas fa-list"></i> Clientes Registrados</h2>
                <div class="clientes-list" id="clientesList">
                    <p style="text-align: center; color: #999;">Cargando clientes...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Cargar clientes al iniciar
        document.addEventListener('DOMContentLoaded', () => {
            cargarClientes();
        });

        // Enviar formulario
        document.getElementById('formCliente').addEventListener('submit', async (e) => {
            e.preventDefault();

            const cliente = {
                nombre: document.getElementById('nombre').value,
                email: document.getElementById('email').value,
                telefono: document.getElementById('telefono').value,
                direccion: document.getElementById('direccion').value,
                empresa: document.getElementById('empresa').value,
                notas: document.getElementById('notas').value
            };

            try {
                const response = await fetch('api/api.php?action=guardar_cliente', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(cliente)
                });

                const result = await response.json();

                if (result.success) {
                    mostrarMensaje('Cliente guardado correctamente', 'success');
                    document.getElementById('formCliente').reset();
                    cargarClientes();
                } else {
                    mostrarMensaje(result.message || 'Error al guardar el cliente', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('Error al guardar el cliente', 'error');
            }
        });

        async function cargarClientes() {
            try {
                const response = await fetch('api/api.php?action=obtener_clientes');
                const clientes = await response.json();

                const clientesList = document.getElementById('clientesList');

                if (clientes.length === 0) {
                    clientesList.innerHTML = '<p style="text-align: center; color: #999;">No hay clientes registrados</p>';
                    return;
                }

                let html = '';
                clientes.forEach(cliente => {
                    html += `
                        <div class="cliente-item">
                            <div class="cliente-info">
                                <h4>${cliente.nombre}</h4>
                                <p><i class="fas fa-envelope"></i> ${cliente.email}</p>
                                <p><i class="fas fa-phone"></i> ${cliente.telefono}</p>
                                ${cliente.empresa ? `<p><i class="fas fa-building"></i> ${cliente.empresa}</p>` : ''}
                            </div>
                            <div>
                                <button class="btn-edit" onclick="editarCliente('${cliente.id}')">
                                    <i class="fas fa-edit"></i> Editar
                                </button>
                                <button class="btn-delete" onclick="eliminarCliente('${cliente.id}', '${cliente.nombre}')">
                                    <i class="fas fa-trash"></i> Eliminar
                                </button>
                            </div>
                        </div>
                    `;
                });

                clientesList.innerHTML = html;
            } catch (error) {
                console.error('Error al cargar clientes:', error);
                document.getElementById('clientesList').innerHTML = '<p style="color: red;">Error al cargar los clientes</p>';
            }
        }

        function editarCliente(clienteId) {
            alert('Funcionalidad de edición próximamente');
        }

        async function eliminarCliente(clienteId, nombre) {
            if (!confirm(`¿Está seguro de que desea eliminar a ${nombre}?`)) return;

            try {
                const response = await fetch('api/api.php?action=eliminar_cliente', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: `cliente_id=${clienteId}`
                });

                const result = await response.json();

                if (result.success) {
                    mostrarMensaje('Cliente eliminado correctamente', 'success');
                    cargarClientes();
                } else {
                    mostrarMensaje(result.message || 'Error al eliminar el cliente', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('Error al eliminar el cliente', 'error');
            }
        }

        function mostrarMensaje(mensaje, tipo) {
            const element = document.getElementById('message');
            element.textContent = mensaje;
            element.className = `alert ${tipo}`;
            
            if (tipo === 'success') {
                setTimeout(() => {
                    element.style.display = 'none';
                }, 3000);
            }
        }
    </script>
</body>
</html>
